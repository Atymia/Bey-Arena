<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="-0.1" r="1.1">
      <stop offset="0" stop-color="#1a2030"/>
      <stop offset="0.6" stop-color="#0b0e13"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb627" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb627" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="930" cy="190" r="250" fill="url(#glow)"/>

  <!-- stadium rings in perspective -->
  <g fill="none" stroke="#c9ced6" stroke-opacity="0.25" stroke-width="2">
    <ellipse cx="930" cy="262" rx="300" ry="66"/>
    <ellipse cx="930" cy="262" rx="215" ry="46"/>
    <ellipse cx="930" cy="262" rx="130" ry="26"/>
    <ellipse cx="930" cy="262" rx="58" ry="11" stroke="#ffb627" stroke-opacity="0.8"/>
  </g>

  <!-- spinning top -->
  <g transform="translate(930 190)">
    <ellipse cx="0" cy="78" rx="64" ry="13" fill="#ffb627" opacity="0.2" filter="url(#blur)"/>
    <polygon points="-8,68 8,68 0,92" fill="#222630" stroke="#c9ced6" stroke-width="1.5"/>
    <rect x="-52" y="40" width="104" height="26" rx="8" fill="#1b212b" stroke="#c9ced6" stroke-width="2"/>
    <rect x="-46" y="22" width="92" height="18" rx="6" fill="#c3c9d2"/>
    <rect x="-3" y="22" width="6" height="18" fill="#0b0e13" opacity="0.25"/>
    <path d="M-46 30 Q-74 22 -68 6 Q-54 14 -40 22 Z" fill="#ffb627"/>
    <path d="M46 30 Q74 22 68 6 Q54 14 40 22 Z" fill="#ffb627"/>
    <circle cx="0" cy="22" r="14" fill="#0b0e13" stroke="#ffb627" stroke-width="2"/>
    <circle cx="0" cy="22" r="6" fill="#ffb627"/>
    <path d="M-84 36 A92 22 0 0 1 84 36" fill="none" stroke="#ffb627" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8 10"/>
  </g>

  <!-- title -->
  <g font-family="'Bebas Neue','Impact','Arial Black',sans-serif" font-weight="900">
    <text x="66" y="180" font-size="124" fill="#c9ced6">BEY<tspan fill="#ffb627"> ARENA</tspan></text>
  </g>
  <text x="70" y="226" font-family="'Courier New',monospace" font-size="22" fill="#8b95a1" letter-spacing="5">SPIN · CLASH · RING OUT YOUR RIVAL</text>
  <rect x="70" y="246" width="300" height="3" fill="#ffb627"/>
  <text x="70" y="286" font-family="'Courier New',monospace" font-size="16" fill="#8b95a1" letter-spacing="2">3D  ·  TILT CONTROLS  ·  PLAYS IN YOUR BROWSER</text>
